[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "clickseg"
version = "0.1.0"
description = "Click-based object segmentation with decoder fine-tuning of MobileSAM"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "certifi>=2024.8.30",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "timm==0.9.16",
  "numpy==1.26.4",
  "Pillow>=10.4,<12",
  "mobile-sam",
  "pycocotools==2.0.10",
  "scipy==1.15.3",
]

[project.optional-dependencies]
app = ["gradio==5.49.1", "httpx[socks]>=0.28,<0.29"]

[project.scripts]
clickseg = "clickseg.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/clickseg"]

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git", rev = "f706ad9c4eb7f219c00d9050e46328518ffb65d2" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
